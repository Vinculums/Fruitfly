name: H12 expression smoke

on:
  push:
    branches: [codex/h12-review-plan]
    paths:
      - .github/workflows/h12-expression-smoke.yml
      - src/h12_expression.py
      - experiments/h12/h12_expression_design_v1.md

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - run: python -m pip install numpy==2.4.6
      - name: Verify checkpoint and D0 read-out identities remotely
        run: python src/h12_expression.py smoke --output remote-output/h12-expression-smoke
      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h12-expression-smoke-${{ github.run_id }}
          path: remote-output/
          retention-days: 30
          if-no-files-found: warn
