name: H12 expression registered stage

on:
  push:
    branches: [codex/h12-review-plan]
    paths:
      - experiments/h12/expression_request.json

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - run: python -m pip install numpy==2.4.6
      - name: Run the requested registered stage and retain stdout
        shell: bash
        run: |
          set -o pipefail
          stage=$(jq -r '.stage' experiments/h12/expression_request.json)
          case "$stage" in calibration|development|evaluation) ;; *) exit 2;; esac
          mkdir -p "remote-output/$stage"
          python src/h12_expression.py "$stage" --output "remote-output/$stage" 2>&1 | tee "remote-output/$stage/stdout.log"
      - name: Preserve raw stage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h12-expression-${{ github.run_id }}
          path: remote-output/
          retention-days: 90
          if-no-files-found: warn
