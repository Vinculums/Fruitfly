name: H12 collect result summary

on:
  push:
    branches: [codex/h12-review-plan]
    paths: [.github/workflows/h12-collect-summary.yml]

permissions:
  actions: read
  contents: read

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - run: python -m pip install numpy==2.4.6
      - name: Extract compact reports from the completed remote run
        run: |
          gh run download 36260387653 --repo Vinculums/Fruitfly --name h12-remote-36260387653-1 --dir full
          mkdir -p summary/diagnosis
          cp full/runtime.json summary/runtime.json
          cp full/diagnosis/{manifest.json,summary.json,report.md} summary/diagnosis/
          sha256sum full/diagnosis/events.npz > summary/events-sha256.txt
          stat --format='%s' full/diagnosis/events.npz > summary/events-size.txt
          cat summary/diagnosis/report.md
      - name: Inspect stored retention rows without rerunning simulation
        run: |
          python notes/reviews/h12_inspect_retention.py --events full/diagnosis/events.npz --output summary/diagnosis/retention-inspection.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: h12-summary-36260387653
          path: summary/
          retention-days: 30
