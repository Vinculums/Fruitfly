name: H12 erratum physical-side strata

on:
  push:
    branches: [codex/h12-review-plan]
    paths:
      - src/h12_expression_erratum.py
      - .github/workflows/h12-erratum.yml

permissions:
  contents: read

jobs:
  erratum:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.15'
      - run: python -m pip install numpy==2.4.6
      - name: Recompute equal-value strata from preserved rows (no simulation)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p remote-output/erratum
          git rev-parse HEAD > remote-output/erratum/commit.txt
          python src/h12_expression_erratum.py --output remote-output/erratum 2>&1 | tee remote-output/erratum/stdout.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: h12-erratum-${{ github.run_id }}
          path: remote-output/
          retention-days: 90
          if-no-files-found: warn
